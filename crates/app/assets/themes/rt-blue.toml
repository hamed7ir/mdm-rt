# RT Blue: one of MDM RT's built-in themes, 7-Zip RT's dark look (made by mdm-rt/branding/make-themes.py:
# Kodi RT's purple palette, or its lightness and saturation in the accent's hue). Dark on both sides.

name = "RT Blue"
icons = "accent"

[seeds.light]
background = "#0b1b33"
surface = "#05101f"
header = "#081e40"
text = "#e6eefa"
accent = "#3d8bff"
selection = "#3a66a8"
error = "#ff8f9e"
warning = "#ffc561"
success = "#6ccb5f"

