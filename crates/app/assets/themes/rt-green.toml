# RT Green: one of MDM RT's built-in themes, 7-Zip RT's dark look (made by mdm-rt/branding/make-themes.py:
# Kodi RT's purple palette, or its lightness and saturation in the accent's hue). Dark on both sides.

name = "RT Green"
icons = "accent"

[seeds.light]
