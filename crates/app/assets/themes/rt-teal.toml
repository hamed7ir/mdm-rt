# RT Teal: one of MDM RT's built-in themes, 7-Zip RT's dark look (made by mdm-rt/branding/make-themes.py:
# Kodi RT's purple palette, or its lightness and saturation in the accent's hue). Dark on both sides.

name = "RT Teal"
icons = "accent"

[seeds.light]
background = "#112d2b"
surface = "#091b1a"
header = "#103834"
text = "#e9f7f6"
accent = "#25dac9"
selection = "#4a9891"
error = "#ff8f9e"
warning = "#ffc561"
success = "#6ccb5f"

[seeds.dark]
background = "#112d2b"
surface = "#091b1a"
header = "#103834"
text = "#e9f7f6"
