# RT Gray: one of MDM RT's built-in themes, 7-Zip RT's dark look (made by mdm-rt/branding/make-themes.py:
# Kodi RT's purple palette, or its lightness and saturation in the accent's hue). Dark on both sides.

name = "RT Gray"
icons = "accent"

[seeds.light]
background = "#1e1f20"
surface = "#111213"
header = "#222426"
text = "#eff0f1"
accent = "#9aa0a6"
selection = "#6d7174"
error = "#ff8f9e"
warning = "#ffc561"
success = "#6ccb5f"

[seeds.dark]
background = "#1e1f20"
surface = "#111213"
header = "#222426"
text = "#eff0f1"
